name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 10

    steps:
      - name: Install validation tools
        run: pacman -Syu --noconfirm git jq nodejs qt5-declarative shellcheck

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint shell scripts
        run: shellcheck scripts/check scripts/check-ci

      - name: Run portable plugin checks
        run: ./scripts/check-ci

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release for manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r '.version' manifest.json)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          archive="omarchy-taskwarrior-$version.tar.gz"
          git archive --format=tar.gz --prefix="omarchy-taskwarrior-$version/" --output="$archive" "$GITHUB_SHA"
          sha256sum "$archive" > "$archive.sha256"

          gh release create "$tag" "$archive" "$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Omarchy Taskwarrior $tag" \
            --generate-notes

          echo "Published $tag." >> "$GITHUB_STEP_SUMMARY"
